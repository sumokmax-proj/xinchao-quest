<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#13241f">
<title>씬짜오 퀘스트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Jua&display=swap" rel="stylesheet">
</head>
<body>
<div id="game">
  <div id="labels"></div>
  <div class="dim" id="dim"></div>
  <div id="quizLayer">
    <div class="quiz" id="quiz" hidden>
      <p class="qk" id="qKind">무슨 뜻?</p>
      <p class="qq" id="qText"></p>
      <div class="qa">
        <button type="button" id="ansL"><span class="arr">←</span><span id="ansLText"></span></button>
        <button type="button" id="ansR"><span id="ansRText"></span><span class="arr">→</span></button>
      </div>
      <div class="qt"><i id="qTimer"></i></div>
    </div>
  </div>
  <div class="hurt" id="hurt"></div>

  <header class="hud">
    <div class="me">
      <div class="row"><span class="lv" id="lv">Lv 1</span><div class="bar" id="hpBar"><i id="hpFill"></i><b id="hpText">100 / 100</b></div></div>
      <div class="bar exp"><i id="expFill" style="width:0%"></i></div>
    </div>
    <div class="side">
      <span class="chip" id="waveChip">웨이브 1 / 3</span>
      <span class="chip gold" id="goldChip">0₫</span>
      <div class="tools"><button type="button" class="tool" id="btnPixel">도트 켬</button><button type="button" class="tool" id="btnSound">소리 켬</button></div>
    </div>
  </header>

  <div class="hint" id="hint">고블린 쪽으로 이동하면 자동으로 공격해요</div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="bannerHost"></div>

  <button type="button" class="itembtn" id="btnItem" aria-label="반미 먹기 (HP 회복)" hidden><span class="sicon banhmi"></span><b id="itemCount">0</b></button>

  <nav class="dpad" id="dpad" aria-label="이동">
    <button type="button" data-dir="up" aria-label="위"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg></button>
    <button type="button" data-dir="left" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="M5 12l11-8v16z"/></svg></button>
    <button type="button" data-dir="right" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M19 12L8 20V4z"/></svg></button>
    <button type="button" data-dir="down" aria-label="아래"><svg viewBox="0 0 24 24"><path d="M12 19L4 8h16z"/></svg></button>
  </nav>

  <section class="overlay" id="startOv">
    <h1>씬짜오 퀘스트 3D</h1>
    <p class="sub"><span id="version"></span></p>
    <p class="profile" id="startProfile" hidden></p>
    <button type="button" class="btn" id="btnStart">모험 시작</button>
    <button type="button" class="btn ghost" id="btnBook">단어장 <small id="bookCount"></small><i class="badge" id="bookBadge" hidden></i></button>
    <p class="note" id="startNote"></p>
  </section>

  <section class="overlay book" id="stageOv" hidden>
    <h2>어디로 갈까요?</h2>
    <div class="booklist" id="stageList"></div>
    <button type="button" class="btn ghost" id="btnStageClose">닫기</button>
  </section>

  <section class="overlay book" id="shopOv" hidden>
    <h2><span id="shopTitle">상점</span> <small class="shopgold" id="shopGold"></small></h2>
    <div class="booklist" id="shopList"></div>
    <button type="button" class="btn ghost" id="btnShopClose">닫기</button>
  </section>

  <section class="overlay book" id="bookOv" hidden>
    <div class="tabs" role="tablist">
      <button type="button" id="tabDex" class="on">도감 <b id="tabDexN"></b></button>
      <button type="button" id="tabWrong">오답노트 <b id="tabWrongN"></b></button>
    </div>
    <div class="booklist" id="bookList"></div>
    <button type="button" class="btn ghost" id="btnBookClose">닫기</button>
  </section>

  <section class="overlay" id="endOv" hidden>
    <h2 id="endTitle">클리어</h2>
    <p class="sub" id="endSub"></p>
    <dl class="stats" id="endStats"></dl>
    <div class="wordcols">
      <div><h3 class="listhead good" id="endLearnedHead"></h3><ul class="wrongs learned" id="endLearned"></ul></div>
      <div><h3 class="listhead" id="endWrongsHead"></h3><ul class="wrongs" id="endWrongs"></ul></div>
    </div>
    <div class="btnrow">
      <button type="button" class="btn ghost" id="btnMenu">목록</button>
      <button type="button" class="btn ghost" id="btnBook2">단어장</button>
      <button type="button" class="btn" id="btnRetry">다시 하기</button>
    </div>
  </section>

  <div class="err" id="err" hidden><p>3D 화면을 불러오지 못했어요. 이 브라우저에서 WebGL이 꺼져 있는 것 같아요. 다른 브라우저에서 다시 열어 주세요.</p></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
