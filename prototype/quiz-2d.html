<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씬짜오 퀘스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* Night in a Hanoi alley: jade-ink ground, lantern gold for rewards, lacquer red for danger, river teal for the player. One column, battle card anchored to the bottom like a handheld RPG. */
  --ground:#0e2622;
  --panel:#163a34;
  --panel-2:#1d4a42;
  --line:#2f6157;
  --ink:#f3ead6;
  --muted:#a9c2b8;
  --gold:#f2b84b;
  --red:#e0553f;
  --teal:#5cc8c0;
  --good:#7bd88f;
  --font-display:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --font-body:'Be Vietnam Pro','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(242,184,75,.16), transparent 22%),
    radial-gradient(circle at 88% 14%, rgba(224,85,63,.14), transparent 20%),
    var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;height:100%;margin:0 auto;padding:12px 16px 16px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}

/* title */
.title-top{text-align:center;padding-top:12px}
.eyebrow{margin:0;color:var(--muted);font-size:13px;letter-spacing:.02em}
h1,h2{font-family:var(--font-display);font-weight:400;margin:4px 0 0;text-wrap:balance}
h1{font-size:44px;color:var(--gold);text-shadow:0 3px 0 #7a4f10}
h2{font-size:34px;color:var(--gold);text-align:center}
.tag{margin:2px 0 0;color:var(--muted);text-align:center}
.hero-mon{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:130px}
.hero-mon .m{width:84px;animation:bob 2.4s ease-in-out infinite}
.hero-mon .m.big{width:124px;animation-delay:.4s}
.hero-mon .m:last-child{animation-delay:.8s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stats.grid{grid-template-columns:repeat(2,1fr)}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.howto{margin:0;padding:12px 14px 12px 32px;background:var(--panel);border-radius:12px;color:var(--muted);font-size:14px;line-height:1.55;display:grid;gap:4px}
.howto b{color:var(--ink);font-weight:700}
.actions{display:grid;gap:10px;margin-top:auto}
.btn{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);font-weight:700;font-size:16px}
.btn.primary{background:var(--gold);border-color:#c98a1c;color:#2a1a00;box-shadow:0 4px 0 #9a6612}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6612}
.btn.ghost{background:transparent}
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px;font-size:13px}
.foot .link{margin-left:auto}
.note{color:var(--muted);font-size:13px;margin:0}

/* battle */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage{font-family:var(--font-display);font-size:18px}
.stage small{font-family:var(--font-body);color:var(--muted);font-size:12px;margin-left:4px}
.dots{display:flex;gap:5px;align-items:center;min-width:60px;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--teal)}
.dots i.now{background:var(--ink)}
.dots i.ghost{outline:1px dashed var(--muted);outline-offset:1px}
.dots i.boss{width:14px;height:14px;border-radius:3px;transform:rotate(45deg)}
.dots i.boss.now{background:var(--gold)}
.arena{position:relative;isolation:isolate;flex:1;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:10px}
.arena::after{content:"";position:absolute;bottom:6px;left:50%;width:140px;height:16px;margin-left:-70px;border-radius:50%;background:rgba(0,0,0,.3);z-index:-1}
.mon-name{display:flex;gap:8px;align-items:baseline}
.mon-name strong{font-size:18px}
.mon-name span{color:var(--muted);font-size:14px}
.hpbar{position:relative;height:12px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.hpbar i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:999px;transition:width .35s ease}
.hpbar.mon{width:62%;margin:6px 0 8px}
.hpbar.mon i{background:var(--red)}
.mon{width:150px;transition:transform .5s, opacity .5s}
.mon.boss{width:200px}
.mon svg{display:block;width:100%;animation:bob 2.2s ease-in-out infinite}
.mon.enter{animation:enter .45s ease-out}
.mon.hit svg{animation:shake .35s}
.mon.hit{filter:brightness(1.8)}
.mon.attack{animation:lunge .4s}
.mon.dead{transform:scale(.2) translateY(40px);opacity:0}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;position:relative}
.player.hurt{animation:shake .35s;border-color:var(--red)}
.prow{display:flex;align-items:center;gap:10px}
.lv{font-family:var(--font-display);font-size:18px;color:var(--teal);min-width:44px}
.hpbar.me{flex:1;height:18px}
.hpbar.me i{background:var(--teal)}
.hpbar.me.low i{background:var(--red)}
.hpbar.me b{position:relative;display:block;text-align:center;font-size:12px;line-height:18px;font-variant-numeric:tabular-nums}
.combo{font-family:var(--font-display);color:var(--gold);font-size:16px}
.prow.small{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.expbar{flex:1;height:6px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.expbar i{display:block;height:100%;background:var(--gold);transition:width .35s}
.card{background:var(--ink);color:#1f2a27;border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.qhead{display:flex;justify-content:space-between;align-items:center;min-height:30px}
#qType{font-weight:700;font-size:13px;color:#3d6b60;background:#e2dcc6;border-radius:999px;padding:4px 10px}
#qType:empty{visibility:hidden}
.card .chip{background:#e2dcc6;border-color:#cfc7ad;color:#1f2a27}
.timer{height:6px;border-radius:999px;background:#ded6bd;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--teal)}
.timer i.low{background:var(--red)}
.prompt{margin:4px 0 0;text-align:center;font-weight:800;font-size:30px;line-height:1.25;min-height:40px;text-wrap:balance}
.prompt.long{font-size:23px}
.prompt.msg{font-family:var(--font-display);font-weight:400;font-size:24px;color:#3d6b60}
.prompt .gap{display:inline-block;min-width:2.4em;border-bottom:3px solid #1f2a27;margin:0 .15em}
.sub{margin:-4px 0 0;text-align:center;color:#5b6b66;font-size:14px;min-height:0}
.sub:empty{display:none}
.listen{display:inline-flex;align-items:center;gap:10px;border:0;background:#1f2a27;color:var(--ink);border-radius:999px;padding:10px 22px;font-size:17px;font-weight:700}
.listen svg{width:26px;height:26px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:58px;border-radius:12px;border:2px solid #d3cbb0;background:#fffaf0;font-size:17px;font-weight:700;padding:8px;line-height:1.25;color:#1f2a27}
.opt:active{transform:translateY(2px)}
.opt:disabled{cursor:default}
.opt.is-right{background:var(--good);border-color:#3e9a55}
.opt.is-wrong{background:#f2a497;border-color:var(--red)}
.opt.dim{opacity:.45}
.reveal{display:grid;gap:8px}
.reveal p{margin:0;text-align:center;font-size:15px;line-height:1.45}
.reveal p strong{font-size:17px}
.reveal .btn{min-height:48px}

/* floating text + toasts */
.float{position:absolute;left:50%;bottom:120px;z-index:2;transform:translateX(-50%);font-family:var(--font-display);font-size:30px;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:none;animation:rise .95s ease-out forwards;white-space:nowrap}
.float.crit{font-size:40px;color:#ffdf6b}
.float.dmg{color:var(--red);top:-6px;bottom:auto;font-size:26px}
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:5;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--gold);color:#2a1a00;border-radius:12px;padding:10px 14px;font-weight:700;text-align:center;box-shadow:0 4px 0 #9a6612;animation:drop .3s ease-out}
.toast.level{background:var(--teal);color:#06231f;box-shadow:0 4px 0 #2b7d77}

/* notes */
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px;overflow:auto}
.notes li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.notes li div{flex:1;display:grid;gap:2px}
.notes strong{font-size:17px}
.notes span{color:var(--muted);font-size:14px}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes lunge{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(26px) scale(1.12)}}
@keyframes enter{from{transform:translateY(-30px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.arena{min-height:140px}.mon{width:120px}.mon.boss{width:160px}.prompt{font-size:26px}.opt{min-height:50px}}
</style>
</head>
<body>
<main class="app">

  <section id="title" class="screen">
    <div class="title-top">
      <p class="eyebrow">베트남어 RPG · 스테이지 1 프로토타입</p>
      <h1>씬짜오 퀘스트</h1>
      <p class="tag" lang="vi">Xin Chào Quest</p>
    </div>
    <div class="hero-mon" id="heroMon"></div>
    <dl class="stats">
      <div><dt>레벨</dt><dd id="tLevel">1</dd></div>
      <div><dt>골드</dt><dd id="tGold">0₫</dd></div>
      <div><dt>오답노트</dt><dd id="tWrong">0개</dd></div>
    </dl>
    <ol class="howto">
      <li>문제를 맞히면 <b>공격</b>, 틀리거나 시간이 지나면 <b>반격</b>을 받아요.</li>
      <li>3초 안에 맞히면 <b>크리티컬</b>, 연속 정답은 <b>콤보</b>로 데미지가 올라요.</li>
      <li>틀린 단어는 <b>복습 유령</b>이 되어 다음 전투에 다시 나타나요.</li>
    </ol>
    <div class="actions">
      <button id="btnStart" class="btn primary" type="button">스테이지 1 우리 집, 전투 시작</button>
      <button id="btnNotes" class="btn" type="button">오답노트 보기</button>
    </div>
    <div class="foot">
      <button id="btnSound" class="chip" type="button">소리 켬</button>
      <span id="voiceNote" class="note"></span>
      <button id="btnReset" class="link" type="button">기록 초기화</button>
    </div>
  </section>

  <section id="battle" class="screen" hidden>
    <header class="bar">
      <button class="link" id="btnQuit" type="button">나가기</button>
      <span class="stage">1. 우리 집<small lang="vi">Nhà tôi</small></span>
      <span class="dots" id="dots"></span>
    </header>
    <div class="arena" id="arena">
      <div class="mon-name"><strong id="monVi" lang="vi"></strong><span id="monKo"></span></div>
      <div class="hpbar mon"><i id="monHpFill"></i></div>
      <div class="mon" id="monSprite"></div>
    </div>
    <div class="player" id="player">
      <div class="prow">
        <span class="lv" id="pLv">Lv 1</span>
        <div class="hpbar me" id="pHp"><i id="pHpFill"></i><b id="pHpText"></b></div>
        <span class="combo" id="combo" hidden></span>
      </div>
      <div class="prow small"><div class="expbar" title="경험치"><i id="pExpFill"></i></div><span id="pGold">0₫</span></div>
    </div>
    <div class="card" id="card">
      <div class="qhead"><span id="qType"></span><button id="btnSpeak" class="chip" type="button" hidden>발음 듣기</button></div>
      <div class="timer"><i id="timerFill"></i></div>
      <p class="prompt" id="qPrompt"></p>
      <p class="sub" id="qSub"></p>
      <div class="options" id="options"></div>
      <div class="reveal" id="reveal" hidden>
        <p id="revealText"></p>
        <button id="btnNext" class="btn primary" type="button" hidden>계속</button>
      </div>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <h2 id="rTitle">스테이지 클리어</h2>
    <p class="tag" id="rSub"></p>
    <dl class="stats grid" id="rStats"></dl>
    <div class="actions">
      <button id="btnRetry" class="btn primary" type="button">다시 도전</button>
      <button id="btnRNotes" class="btn" type="button">오답노트 보기</button>
      <button id="btnHome" class="btn ghost" type="button">처음 화면</button>
    </div>
  </section>

  <section id="notes" class="screen" hidden>
    <header class="bar">
      <button class="link" id="btnNotesBack" type="button">뒤로</button>
      <span class="stage">오답노트</span>
      <span class="dots"></span>
    </header>
    <p class="note" id="notesEmpty">아직 틀린 문제가 없어요. 전투에서 틀린 문제가 여기에 쌓여요.</p>
    <ul class="notes" id="notesList"></ul>
    <p class="note">두 번 연속으로 맞히면 오답노트에서 빠져요.</p>
  </section>

</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---------- data ---------- */
const WORDS = [
  ['xin chào','안녕하세요'], ['cảm ơn','감사합니다'], ['xin lỗi','죄송합니다'],
  ['tạm biệt','잘 가요 (작별 인사)'], ['vâng','네 (공손한 대답)'], ['không','아니요'],
  ['tên','이름'], ['tôi','나, 저'], ['bạn','친구, 너'],
  ['người Hàn Quốc','한국 사람'], ['người Việt Nam','베트남 사람'],
  ['bố','아빠'], ['mẹ','엄마'], ['anh trai','형, 오빠'], ['chị gái','누나, 언니'],
  ['em gái','여동생'], ['vợ','아내'], ['chồng','남편'], ['gia đình','가족'],
  ['khỏe','건강하다, 잘 지내다'], ['tuổi','나이, ~살'], ['làm việc','일하다'],
  ['công ty','회사'], ['nhà','집'], ['sống','살다'], ['rất vui được gặp bạn','만나서 반가워요']
].map(([vi,ko]) => ({vi, ko, key:'w:'+vi}));

const BLANKS = [
  {s:'Tôi ___ người Hàn Quốc.', a:'là', o:['là','có','ở','đi'], ko:'저는 한국 사람입니다.'},
  {s:'Tôi ___ ở Hà Nội.', a:'sống', o:['sống','ăn','uống','ngủ'], ko:'저는 하노이에 살아요.'},
  {s:'Bạn tên là ___?', a:'gì', o:['gì','đâu','ai','nào'], ko:'이름이 뭐예요?'},
  {s:'Rất vui được ___ bạn.', a:'gặp', o:['gặp','ăn','đi','ngủ'], ko:'만나서 반가워요.'},
  {s:'Tôi ___ việc ở công ty.', a:'làm', o:['làm','ăn','ngủ','uống'], ko:'저는 회사에서 일해요.'},
  {s:'Năm nay bạn bao nhiêu ___?', a:'tuổi', o:['tuổi','tên','nhà','người'], ko:'올해 몇 살이에요?'},
  {s:'Bạn có ___ không?', a:'khỏe', o:['khỏe','tên','nhà','mẹ'], ko:'잘 지내요?'},
  {s:'Cảm ơn bạn ___ nhiều.', a:'rất', o:['rất','không','là','có'], ko:'정말 고마워요.'}
].map(b => ({...b, key:'b:'+b.s}));

const ITEMS = new Map();
WORDS.forEach(w => ITEMS.set(w.key, w));
BLANKS.forEach(b => ITEMS.set(b.key, b));

const MONSTERS = [
  {vi:'Muỗi', ko:'모기', hp:20, exp:10, gold:2000, color:'#c9a5e8', feat:'wings'},
  {vi:'Kiến', ko:'개미', hp:24, exp:12, gold:3000, color:'#e8875e', feat:'antenna'},
  {vi:'Chuột', ko:'쥐', hp:28, exp:14, gold:4000, color:'#b8b2a6', feat:'ears'},
  {vi:'Gián', ko:'바퀴벌레', hp:32, exp:16, gold:5000, color:'#9a6a45', feat:'antenna'},
  {vi:'Thạch Sùng', ko:'도마뱀붙이', hp:36, exp:18, gold:6000, color:'#9cc27a', feat:'tail'}
];
const GHOST = {vi:'Ma Ôn Tập', ko:'복습 유령', hp:24, exp:15, gold:5000, color:'#bfe3ef', feat:'ghost', ghost:true};
const BOSS = {vi:'Vua Mất Điện', ko:'정전 대왕', hp:90, exp:60, gold:50000, color:'#5a5f8f', feat:'crown', boss:true};

const TYPE_LABEL = {vi2ko:'뜻 고르기', ko2vi:'베트남어로 고르기', listen:'듣고 뜻 고르기', blank:'빈칸 채우기'};
const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

/* ---------- save ---------- */
const SAVE_KEY = 'xinchao-quest-v1';
let save = {level:1, exp:0, gold:0, wrong:{}, sound:true};
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) save = Object.assign(save, JSON.parse(raw)); } catch (e) {}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const $ = s => document.querySelector(s);
const fmtD = n => n.toLocaleString('vi-VN') + '₫';
const maxHp = () => 60 + (save.level - 1) * 8;
const atk = () => 10 + (save.level - 1) * 2;
const needExp = () => 40 + (save.level - 1) * 20;
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- sound + voice ---------- */
let actx = null, viVoice = null, voiceOK = false;
function loadVoices(){
  try {
    const vs = speechSynthesis.getVoices();
    viVoice = vs.find(v => /^vi/i.test(v.lang)) || null;
    voiceOK = !!viVoice;
  } catch (e) { voiceOK = false; }
  renderVoiceNote();
}
if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function speak(text, force){
  if (!voiceOK || (!save.sound && !force)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = viVoice; u.lang = viVoice.lang; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function unlockAudio(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  if (voiceOK) { try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }
}
function tone(freqs, dur = 0.08, type = 'square', vol = 0.05){
  if (!actx || !save.sound) return;
  try {
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * 0.9;
    });
  } catch (e) {}
}
const sfx = {
  hit:   () => tone([440, 660]),
  crit:  () => tone([523, 784, 1046], 0.07),
  miss:  () => tone([220, 150], 0.14, 'sawtooth', 0.04),
  kill:  () => tone([523, 659, 784, 1046], 0.09, 'triangle', 0.08),
  level: () => tone([392, 523, 659, 784, 1046], 0.1, 'triangle', 0.08)
};

/* ---------- monster art ---------- */
function monsterSVG(m){
  const c = m.color; let back = '', extra = '';
  if (m.feat === 'wings') back = `<ellipse cx="30" cy="50" rx="24" ry="12" fill="#fff" opacity=".35" transform="rotate(-25 30 50)"/><ellipse cx="90" cy="50" rx="24" ry="12" fill="#fff" opacity=".35" transform="rotate(25 90 50)"/>`;
  if (m.feat === 'antenna') back = `<path d="M50 46 Q42 20 30 16 M70 46 Q78 20 90 16" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="30" cy="16" r="5" fill="${c}"/><circle cx="90" cy="16" r="5" fill="${c}"/>`;
  if (m.feat === 'ears') back = `<circle cx="32" cy="44" r="16" fill="${c}"/><circle cx="88" cy="44" r="16" fill="${c}"/><circle cx="32" cy="44" r="8" fill="#f0a4a4"/><circle cx="88" cy="44" r="8" fill="#f0a4a4"/>`;
  if (m.feat === 'tail') back = `<path d="M90 94 Q118 90 112 62" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  const body = m.feat === 'ghost'
    ? `<path d="M22 70 Q22 26 60 26 Q98 26 98 70 L98 104 Q90 96 82 104 Q74 112 66 104 Q60 96 54 104 Q46 112 38 104 Q30 96 22 104 Z" fill="${c}" opacity=".85"/>`
    : `<ellipse cx="60" cy="74" rx="40" ry="34" fill="${c}"/><ellipse cx="48" cy="58" rx="12" ry="7" fill="#fff" opacity=".18"/>`;
  if (m.feat === 'crown') extra = `<path d="M36 46 L42 22 L52 36 L60 14 L68 36 L78 22 L84 46 Z" fill="#f2b84b" stroke="#a87418" stroke-width="2"/><circle cx="60" cy="31" r="3.5" fill="#e0553f"/>`;
  const eyes = m.boss
    ? `<path d="M38 62 L54 70 M82 62 L66 70" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/><circle cx="48" cy="77" r="6" fill="#fff"/><circle cx="72" cy="77" r="6" fill="#fff"/><circle cx="49" cy="78" r="3" fill="#1a1a1a"/><circle cx="71" cy="78" r="3" fill="#1a1a1a"/>`
    : `<circle cx="47" cy="68" r="8" fill="#fff"/><circle cx="73" cy="68" r="8" fill="#fff"/><circle cx="49" cy="70" r="4" fill="#1a1a1a"/><circle cx="71" cy="70" r="4" fill="#1a1a1a"/>`;
  const mouth = m.boss
    ? `<path d="M48 94 Q60 86 72 94" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : `<path d="M52 86 Q60 92 68 86" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 120 120" aria-hidden="true">${back}${body}${extra}${eyes}${mouth}</svg>`;
}

/* ---------- questions ---------- */
let recent = [];
function pickItem(pool, preferWrong){
  const wrongKeys = Object.keys(save.wrong).filter(k => pool.some(p => p.key === k));
  if (wrongKeys.length && (preferWrong || Math.random() < 0.35)) {
    const k = shuffle(wrongKeys).find(k => !recent.includes(k)) || wrongKeys[0];
    return ITEMS.get(k);
  }
  const fresh = pool.filter(p => !recent.includes(p.key));
  return shuffle(fresh.length ? fresh : pool)[0];
}
function buildQuestion(mon){
  let kind;
  if (mon.boss) kind = Math.random() < 0.6 ? 'blank' : 'ko2vi';
  else {
    const kinds = ['vi2ko', 'ko2vi'];
    if (voiceOK && save.sound) kinds.push('listen', 'listen');
    kind = kinds[Math.floor(Math.random() * kinds.length)];
  }
  const item = kind === 'blank' ? pickItem(BLANKS, mon.ghost)
             : pickItem(mon.ghost ? WORDS.concat(BLANKS) : WORDS, mon.ghost);
  if (item.s) kind = 'blank'; else if (kind === 'blank') kind = 'ko2vi';
  recent.push(item.key); if (recent.length > 6) recent.shift();
  if (kind === 'blank') return {kind, item, prompt:item.s, sub:item.ko, options:shuffle(item.o), answer:item.a};
  const others = shuffle(WORDS.filter(w => w !== item)).slice(0, 3);
  if (kind === 'ko2vi') return {kind, item, prompt:item.ko, sub:'', options:shuffle([item.vi, ...others.map(o => o.vi)]), answer:item.vi};
  return {kind, item, prompt:item.vi, sub:'', options:shuffle([item.ko, ...others.map(o => o.ko)]), answer:item.ko};
}

/* ---------- screens ---------- */
let current = 'title', notesBack = 'title';
function show(id){
  document.querySelectorAll('.screen').forEach(s => { s.hidden = s.id !== id; });
  current = id;
  if (id === 'title') renderTitle();
  if (id === 'notes') renderNotes();
}
function renderTitle(){
  $('#tLevel').textContent = save.level;
  $('#tGold').textContent = fmtD(save.gold);
  $('#tWrong').textContent = Object.keys(save.wrong).length + '개';
  $('#btnSound').textContent = save.sound ? '소리 켬' : '소리 끔';
  if (!$('#heroMon').innerHTML) {
    $('#heroMon').innerHTML = `<div class="m">${monsterSVG(MONSTERS[0])}</div><div class="m big">${monsterSVG(BOSS)}</div><div class="m">${monsterSVG(GHOST)}</div>`;
  }
  renderVoiceNote();
}
function renderVoiceNote(){
  const n = $('#voiceNote'); if (!n) return;
  n.textContent = voiceOK ? '베트남어 음성 사용 가능' : '이 기기에 베트남어 음성이 없어 듣기 문제는 빠져요';
}
function toast(text, cls){
  const t = document.createElement('div');
  t.className = 'toast' + (cls ? ' ' + cls : '');
  t.textContent = text;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 1900);
}
function floatText(text, cls, host){
  const s = document.createElement('span');
  s.className = 'float ' + cls; s.textContent = text;
  host.appendChild(s); setTimeout(() => s.remove(), 1000);
}
function replay(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------- battle ---------- */
let run = null, q = null, locked = true, rafId = 0, qStart = 0, tLimit = 0;

function startRun(){
  unlockAudio();
  const queue = MONSTERS.slice();
  if (Object.keys(save.wrong).length) queue.splice(2, 0, GHOST);
  queue.push(BOSS);
  run = {queue, idx:0, hp:maxHp(), combo:0, maxCombo:0, correct:0, total:0, expGain:0, goldGain:0, newWrong:new Set()};
  recent = [];
  show('battle');
  spawn();
}
function renderDots(){
  $('#dots').innerHTML = run.queue.map((m, i) =>
    `<i class="${i < run.idx ? 'done' : i === run.idx ? 'now' : ''}${m.boss ? ' boss' : ''}${m.ghost ? ' ghost' : ''}"></i>`).join('');
}
function spawn(){
  const m = run.queue[run.idx];
  run.mon = m; run.monHp = m.hp; locked = true;
  const sp = $('#monSprite');
  sp.className = 'mon' + (m.boss ? ' boss' : '');
  sp.innerHTML = monsterSVG(m);
  replay(sp, 'enter');
  $('#monVi').textContent = m.vi; $('#monKo').textContent = m.ko;
  renderDots(); updateHUD();
  $('#qType').textContent = ''; $('#btnSpeak').hidden = true;
  $('#options').innerHTML = ''; $('#reveal').hidden = true; $('#qSub').textContent = '';
  const p = $('#qPrompt'); p.className = 'prompt msg';
  p.textContent = m.boss ? '보스 등장! 정전 대왕' : m.ghost ? '틀렸던 단어가 돌아왔다!' : '등장: ' + m.ko;
  $('#timerFill').style.width = '100%'; $('#timerFill').classList.remove('low');
  setTimeout(nextQuestion, 950);
}
function nextQuestion(){
  if (current !== 'battle') return;
  q = buildQuestion(run.mon);
  $('#qType').textContent = TYPE_LABEL[q.kind];
  $('#reveal').hidden = true; $('#btnNext').hidden = true;
  const p = $('#qPrompt');
  p.className = 'prompt' + (q.prompt.length > 16 && q.kind !== 'listen' ? ' long' : '');
  if (q.kind === 'listen') {
    p.innerHTML = ''; p.lang = 'ko';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'listen'; b.innerHTML = SPEAKER + '<span>다시 듣기</span>';
    b.addEventListener('click', () => speak(q.item.vi, true));
    p.appendChild(b);
  } else if (q.kind === 'blank') {
    p.lang = 'vi';
    p.innerHTML = q.prompt.replace('___', '<span class="gap"></span>');
  } else {
    p.lang = q.kind === 'ko2vi' ? 'ko' : 'vi';
    p.textContent = q.prompt;
  }
  $('#qSub').textContent = q.sub;
  $('#btnSpeak').hidden = !(voiceOK && save.sound && q.kind === 'vi2ko');
  const box = $('#options'); box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.textContent = opt; b.id = 'opt' + i;
    b.lang = (q.kind === 'ko2vi' || q.kind === 'blank') ? 'vi' : 'ko';
    b.addEventListener('click', () => answer(opt));
    box.appendChild(b);
  });
  locked = false;
  if (q.kind === 'listen') setTimeout(() => speak(q.item.vi, true), 200);
  startTimer(run.mon.boss ? 14000 : q.kind === 'listen' ? 12000 : 10000);
}
function startTimer(ms){
  tLimit = ms; qStart = performance.now();
  const fill = $('#timerFill');
  cancelAnimationFrame(rafId);
  const step = () => {
    const left = Math.max(0, 1 - (performance.now() - qStart) / tLimit);
    fill.style.width = (left * 100) + '%';
    fill.classList.toggle('low', left < 0.3);
    if (left <= 0) { answer(null); return; }
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}
function stopTimer(){ cancelAnimationFrame(rafId); }

function answerLine(){
  if (q.kind === 'blank') return `<strong lang="vi">${q.item.s.replace('___', q.item.a)}</strong><br>${q.item.ko}`;
  return `<strong lang="vi">${q.item.vi}</strong> = ${q.item.ko}`;
}
function answer(choice){
  if (locked) return;
  locked = true; stopTimer();
  const elapsed = (performance.now() - qStart) / 1000;
  const ok = choice === q.answer;
  const key = q.item.key;
  run.total++;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('is-right');
    else if (b.textContent === choice) b.classList.add('is-wrong');
    else b.classList.add('dim');
  });
  const reveal = $('#reveal'), rt = $('#revealText');
  reveal.hidden = false;
  const sayText = q.kind === 'blank' ? q.item.s.replace('___', q.item.a) : q.item.vi;

  if (ok) {
    run.correct++; run.combo++; run.maxCombo = Math.max(run.maxCombo, run.combo);
    const crit = elapsed < 3;
    const dmg = Math.round(atk() * (crit ? 2 : 1) * (1 + Math.min(run.combo - 1, 5) * 0.1));
    run.monHp = Math.max(0, run.monHp - dmg);
    floatText((crit ? '크리티컬 ' : '') + dmg, crit ? 'crit' : '', $('#arena'));
    replay($('#monSprite'), 'hit');
    setTimeout(() => $('#monSprite').classList.remove('hit'), 360);
    crit ? sfx.crit() : sfx.hit();
    if (save.wrong[key]) { save.wrong[key].streak++; if (save.wrong[key].streak >= 2) delete save.wrong[key]; }
    rt.innerHTML = (crit ? '크리티컬! ' : '정답! ') + answerLine();
    gainExp(1);
    persist(); updateHUD();
    setTimeout(() => speak(sayText), 150);
    setTimeout(() => { if (current !== 'battle') return; run.monHp <= 0 ? killMonster() : nextQuestion(); }, run.monHp <= 0 ? 800 : 1300);
  } else {
    run.combo = 0;
    save.wrong[key] = {streak:0}; run.newWrong.add(key);
    const dmg = run.mon.boss ? 16 : 10;
    run.hp = Math.max(0, run.hp - dmg);
    replay($('#monSprite'), 'attack');
    replay($('#player'), 'hurt');
    setTimeout(() => $('#player').classList.remove('hurt'), 400);
    floatText('-' + dmg, 'dmg', $('#player'));
    sfx.miss();
    rt.innerHTML = (choice === null ? '시간 초과. ' : '오답. ') + '정답은 ' + answerLine();
    persist(); updateHUD();
    setTimeout(() => speak(sayText), 300);
    const nb = $('#btnNext');
    nb.textContent = run.hp <= 0 ? '결과 보기' : '계속';
    nb.hidden = false; nb.focus();
  }
}
function onNext(){
  if (!run || current !== 'battle') return;
  $('#btnNext').hidden = true;
  if (run.hp <= 0) finish(false); else nextQuestion();
}
function gainExp(n){
  save.exp += n; run.expGain += n;
  while (save.exp >= needExp()) {
    save.exp -= needExp(); save.level++;
    run.hp = Math.min(maxHp(), run.hp + 20);
    toast('레벨 업! Lv ' + save.level + ' · 공격력과 최대 HP 상승', 'level');
    sfx.level();
  }
}
function killMonster(){
  const m = run.mon;
  $('#monSprite').classList.add('dead');
  sfx.kill();
  save.gold += m.gold; run.goldGain += m.gold;
  toast(m.ko + ' 처치! +' + m.exp + ' EXP · +' + fmtD(m.gold));
  gainExp(m.exp);
  persist(); updateHUD();
  run.idx++;
  renderDots();
  if (run.idx >= run.queue.length) setTimeout(() => finish(true), 1200);
  else setTimeout(() => { if (current === 'battle') spawn(); }, 1300);
}
function updateHUD(){
  const mh = maxHp();
  $('#pLv').textContent = 'Lv ' + save.level;
  $('#pHpFill').style.width = (run.hp / mh * 100) + '%';
  $('#pHp').classList.toggle('low', run.hp / mh < 0.3);
  $('#pHpText').textContent = run.hp + ' / ' + mh;
  $('#pExpFill').style.width = (save.exp / needExp() * 100) + '%';
  $('#pGold').textContent = fmtD(save.gold);
  const c = $('#combo'); c.hidden = run.combo < 2; c.textContent = '콤보 ×' + run.combo;
  if (run.mon) $('#monHpFill').style.width = (run.monHp / run.mon.hp * 100) + '%';
}
function finish(win){
  stopTimer(); locked = true;
  let lost = 0;
  if (!win) { lost = Math.floor(run.goldGain / 2 / 1000) * 1000; save.gold = Math.max(0, save.gold - lost); }
  persist();
  $('#rTitle').textContent = win ? '스테이지 클리어' : '쓰러졌어요';
  $('#rSub').textContent = win
    ? '정전 대왕을 물리쳐서 우리 집에 다시 불이 들어왔어요.'
    : '이번 전투에서 번 골드의 절반을 잃었어요. 레벨과 경험치는 그대로예요.';
  const acc = run.total ? Math.round(run.correct / run.total * 100) : 0;
  const rows = [
    ['정답률', acc + '% (' + run.correct + '/' + run.total + ')'],
    ['최대 콤보', run.maxCombo + '연속'],
    ['얻은 경험치', '+' + run.expGain + ' EXP'],
    ['얻은 골드', '+' + fmtD(run.goldGain - lost)],
    ['새 오답', run.newWrong.size + '개'],
    ['현재 레벨', 'Lv ' + save.level]
  ];
  $('#rStats').innerHTML = rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  show('result');
}

/* ---------- notes ---------- */
function renderNotes(){
  const keys = Object.keys(save.wrong).filter(k => ITEMS.has(k));
  const list = $('#notesList'); list.innerHTML = '';
  $('#notesEmpty').hidden = keys.length > 0;
  keys.forEach(k => {
    const it = ITEMS.get(k);
    const vi = it.s ? it.s.replace('___', it.a) : it.vi;
    const li = document.createElement('li');
    const d = document.createElement('div');
    const s1 = document.createElement('strong'); s1.lang = 'vi'; s1.textContent = vi;
    const s2 = document.createElement('span'); s2.textContent = it.ko;
    d.append(s1, s2); li.appendChild(d);
    if (voiceOK) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = '듣기';
      b.addEventListener('click', () => { unlockAudio(); speak(vi, true); });
      li.appendChild(b);
    }
    list.appendChild(li);
  });
}

/* ---------- wiring ---------- */
$('#btnStart').addEventListener('click', startRun);
$('#btnRetry').addEventListener('click', startRun);
$('#btnHome').addEventListener('click', () => show('title'));
$('#btnNotes').addEventListener('click', () => { notesBack = 'title'; show('notes'); });
$('#btnRNotes').addEventListener('click', () => { notesBack = 'result'; show('notes'); });
$('#btnNotesBack').addEventListener('click', () => show(notesBack));
$('#btnNext').addEventListener('click', onNext);
$('#btnSpeak').addEventListener('click', () => q && speak(q.item.vi, true));
$('#btnQuit').addEventListener('click', () => { stopTimer(); locked = true; try { speechSynthesis.cancel(); } catch (e) {} show('title'); });
$('#btnSound').addEventListener('click', () => { save.sound = !save.sound; persist(); unlockAudio(); renderTitle(); });
let resetArmed = false;
$('#btnReset').addEventListener('click', e => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = '한 번 더 누르면 초기화'; setTimeout(() => { resetArmed = false; e.target.textContent = '기록 초기화'; }, 3000); return; }
  save = {level:1, exp:0, gold:0, wrong:{}, sound:save.sound}; persist(); resetArmed = false;
  e.target.textContent = '기록 초기화'; renderTitle(); toast('기록을 초기화했어요');
});
document.addEventListener('keydown', e => {
  if (current !== 'battle' || !q) return;
  if (!locked && ['1','2','3','4'].includes(e.key)) { const opt = q.options[Number(e.key) - 1]; if (opt) answer(opt); }
  if (e.key === 'Enter' && !$('#btnNext').hidden) { e.preventDefault(); onNext(); }
});
show('title');
</script>
